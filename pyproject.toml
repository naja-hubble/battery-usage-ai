[project]
name = "battery-usage-ai"
version = "0.1.0"
description = "Download and analyze ThinkPad battery telemetry across many users (usage analysis pipeline)."
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34",
    "pandas>=1.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "tqdm>=4.64",
]

[project.scripts]
battery-usage = "battery_usage.__main__:main"

[tool.setuptools]
packages = ["battery_usage"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
